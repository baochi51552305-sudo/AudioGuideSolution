name: AudioGuide CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 9 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies
      run: dotnet restore AudioGuideSolution.sln

    - name: Build Solution
      run: dotnet build AudioGuideSolution.sln --no-restore --configuration Release

    - name: Run Automated Unit Tests
      run: dotnet test AudioGuide.Tests/AudioGuide.Tests.csproj --no-build --verbosity normal